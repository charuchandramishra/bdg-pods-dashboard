services:
  postgres:
    image: postgres:16-alpine
    container_name: bdg-pods-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bdgpods
      POSTGRES_PASSWORD: bdgpods_secret
      POSTGRES_DB: bdg_pods_dashboard
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bdgpods -d bdg_pods_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
